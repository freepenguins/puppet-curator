---
version: 5
defaults:
  datadir: data
  data_hash: yaml_data
hierarchy:
  - name: "Per-OS defaults"
    paths:
      - "os/%{facts.os.name}/%{facts.os.name}-%{facts.os.release.major}.yaml"
      - "os/%{facts.os.name}.yaml"
      - "os/%{facts.os.family}.yaml"

  - name: "Other YAML hierarchy levels"
    path: "common.yaml"
